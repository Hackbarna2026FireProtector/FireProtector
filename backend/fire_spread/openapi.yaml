openapi: 3.1.0
info:
  title: Fire Spread API
  description: >
    Simulates a point-ignition wildfire via Deepfire and returns a grid of
    first-arrival hours (hour each cell is first reached by the fire).
  version: "1.0.0"

servers:
  - url: /fire

tags:
  - name: fire-spread

paths:
  /arrival-grid:
    get:
      tags:
        - fire-spread
      summary: Simulate a point ignition and return the arrival-hour grid
      description: >
        Queues a 24-hour ELMFIRE point-ignition simulation at the given
        coordinates, waits for it to complete, then rasterises the hourly
        fire perimeters into a grid of first-arrival hours (100m cells).
      operationId: arrivalGrid
      parameters:
        - name: lat
          in: query
          required: true
          description: Ignition point latitude.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          description: Ignition point longitude.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Arrival-hour grid computed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrivalGrid"
        "422":
          description: >
            Validation error (missing/out-of-range lat or lon), or Deepfire
            rejected the ignition point as outside its supported simulation
            areas (continental US, Europe, Hawaii).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "500":
          description: >
            Server misconfiguration (missing Deepfire credentials) or the
            resulting grid exceeded the maximum cell count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "502":
          description: Deepfire returned an unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "503":
          description: Deepfire rate or concurrency limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "504":
          description: Simulation did not finish within Deepfire's timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

components:
  schemas:
    ArrivalGrid:
      type: object
      description: >
        A regular lat/lon grid anchored at its south-west corner, with each
        cell holding the hour it was first reached by the fire (0 = ignition
        cell, null = not reached within the simulation window).
      required:
        - originLat
        - originLon
        - cellDegLat
        - cellDegLon
        - arrivalHours
      properties:
        originLat:
          type: number
          format: double
          description: Latitude of the south-west corner of cell [0][0].
        originLon:
          type: number
          format: double
          description: Longitude of the south-west corner of cell [0][0].
        cellDegLat:
          type: number
          format: double
          description: Cell height in degrees latitude.
        cellDegLon:
          type: number
          format: double
          description: Cell width in degrees longitude (varies with ignition latitude).
        arrivalHours:
          type: array
          description: >
            Rows south-to-north, each a list of columns west-to-east.
            arrivalHours[row][col] is the first hour that cell was reached,
            or null if never reached.
          items:
            type: array
            items:
              type: integer
              nullable: true
              minimum: 0

    HTTPError:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message.
      required:
        - detail
