[project]
name = "fire-spread"
version = "0.2.0"
description = "Self-hosted ELMFIRE fire-spread service for Catalonia"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "shapely>=2.0",
    "numpy>=2.0",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "pydantic-settings>=2.4",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "elmfire: needs the ELMFIRE binary (run inside the container)",
]
