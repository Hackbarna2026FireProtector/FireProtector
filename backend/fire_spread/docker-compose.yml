services:
  fire-spread:
    build: .
    image: fireprotector/fire-spread
    shm_size: "2gb"  # ELMFIRE shares rasters between MPI ranks via /dev/shm (default 64 MB is too small)
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      ELMFIRE_NPROC: ${ELMFIRE_NPROC:-4}
      DATA_DIR: /app/data/catalonia
      RUNS_DIR: /app/data/runs
      KEEP_RUNS: ${KEEP_RUNS:-failed}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-1}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
      OPEN_METEO_ENSEMBLE_BASE_URL: ${OPEN_METEO_ENSEMBLE_BASE_URL:-https://ensemble-api.open-meteo.com}
